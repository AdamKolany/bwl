# ILIAS-Test (Machbarkeit bwl-Editor in STACK-Fragen); Code in /srv/wwwservers/ilias/ilias, Webroot = public
Alias /ilias /srv/wwwservers/ilias/ilias/public
<Directory "/srv/wwwservers/ilias/ilias/public">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
</Directory>

# Das STACK-Plugin baut Links auf seine CORS-Skripte als /Customizing/… (ohne /ilias-Präfix,
# es nimmt ILIAS im Wurzelverzeichnis an) – darum hier zusätzlich auf den ILIAS-Ordner abbilden.
Alias /Customizing /srv/wwwservers/ilias/ilias/public/Customizing
<Directory "/srv/wwwservers/ilias/ilias/public/Customizing">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
