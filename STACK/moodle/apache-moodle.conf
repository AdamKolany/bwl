Alias /moodle /srv/wwwservers/moodle/moodle
<Directory "/srv/wwwservers/moodle/moodle">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
    AcceptPathInfo On
</Directory>

# bwl-Editor in STACK-iframes (Sandbox, Ursprung "null"): Schriften/Skripte brauchen CORS
<Directory "/srv/wwwservers/www/main/html/js">
    Header set Access-Control-Allow-Origin "*"
</Directory>
<Directory "/srv/wwwservers/www/main/html/css">
    Header set Access-Control-Allow-Origin "*"
</Directory>
<Directory "/srv/wwwservers/www/main/html/stackbwl">
    Header set Access-Control-Allow-Origin "*"
</Directory>
